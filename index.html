const images={concert:"https://images.unsplash.com/photo-1459749411175-04bf5292ceea?w=800&q=80",music:"https://images.unsplash.com/photo-1501386761578-eac5c94b800a?w=800&q=80",art:"https://images.unsplash.com/photo-1579783902614-a3fb3927b6a5?w=800&q=80",food:"https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=800&q=80",nightlife:"https://images.unsplash.com/photo-1571266028243-d220c9b3b157?w=800&q=80",community:"https://images.unsplash.com/photo-1528605248644-14dd04022da1?w=800&q=80",workshop:"https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=800&q=80",film:"https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=800&q=80"};
const starter=[
{id:"e1",title:"Dhaka After Dark",category:"Music",date:"2026-11-06",time:"7:00 PM",location:"Gulshan, Dhaka",price:1200,image:images.concert,host:"FOMO Sessions",description:"An intimate night of live music, creative energy, and new connections. Experience Dhaka after dark with a curated lineup.",featured:true},

{id:"e3",title:"Street Food Social",category:"Food",date:"2026-11-13",time:"5:30 PM",location:"Banani, Dhaka",price:450,image:images.food,host:"Taste Dhaka",description:"A casual food crawl celebrating the flavors and people of the city."},
{id:"e4",title:"Midnight Frequencies",category:"Nightlife",date:"2026-11-14",time:"8:00 PM",location:"Tejgaon, Dhaka",price:900,image:images.nightlife,host:"Frequency Club",description:"Discover emerging DJs and a new soundscape in an atmospheric urban space."},

]; // Demonstration events only. Not verified real-world listings.
const store=(k,v)=>localStorage.setItem("fomo_"+k,JSON.stringify(v));
const read=(k,fallback)=>{try{return JSON.parse(localStorage.getItem("fomo_"+k))??fallback}catch{return fallback}};
let events=[...starter,...read("events",[])],saved=read("saved",[]),bookings=read("bookings",[]),posts=read("posts",[]),page="discover",filter="All",query="",selected=null,quantity=1,modal=false,toastTimer;
const $=s=>document.querySelector(s),escapeHTML=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate=s=>new Date(s+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"}),money=n=>n===0?"Free":"৳"+Number(n).toLocaleString("en-BD");
function notify(s){let old=$(".toast");if(old)old.remove();const el=document.createElement("div");el.className="toast";el.textContent=s;document.body.appendChild(el);clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.remove(),3000)}
function go(p){page=p;selected=null;modal=false;window.scrollTo(0,0);render()}
function navItem(p,icon,label){return '<button class="'+(page===p?"active":"")+'" data-page="'+p+'"><span class="symbol">'+icon+'</span>'+label+'</button>'}
function eventCard(e){return '<article class="event" data-event="'+escapeHTML(e.id)+'"><div class="eventImage" style="background-image:url('+escapeHTML(e.image)+')"><span class="datePill">'+fmtDate(e.date)+'</span><button class="save '+(saved.includes(e.id)?"saved":"")+'" data-save="'+escapeHTML(e.id)+'" aria-label="Save event">'+(saved.includes(e.id)?"♥":"♡")+'</button></div><div class="eventBody"><span class="category">'+escapeHTML(e.category)+'</span><h3>'+escapeHTML(e.title)+'</h3><p>⌖ '+escapeHTML(e.location)+'</p><div class="eventFoot"><span>'+fmtDate(e.date)+' · '+escapeHTML(e.time)+'</span><strong>'+money(e.price)+'</strong></div></div></article>'}
function cards(list){return list.length?'<div class="cards">'+list.map(eventCard).join("")+'</div>':'<div class="empty"><h3>Nothing here yet</h3><p>Try a different category or search.</p></div>'}
function discover(){const cats=["All","Music","Art","Food","Nightlife","Community","Workshop"];const filtered=events.filter(e=>(filter==="All"||e.category===filter)&&[e.title,e.location,e.category,e.host].join(" ").toLowerCase().includes(query.toLowerCase()));return '<div class="topline"><span class="eyebrow">Your city, unlocked</span><span class="city">⌖ Dhaka, Bangladesh</span></div><h1 class="pageTitle">Go where life<br>happens<span style="color:#999">.</span></h1><p class="muted" style="font-size:13px">Less scrolling. More living. Find your next story.</p><section class="hero"><div class="heroContent"><span class="eyebrow">Discover something new</span><h2>Good plans.<br>Great stories.</h2><p>Meet your people and discover what's happening around you.</p><button class="primary" data-explore="1">Explore events ↗</button></div></section><div class="sectionHeading" id="explore"><h2>Explore events</h2><span class="muted" style="font-size:12px">'+filtered.length+' events</span></div><div class="chips">'+cats.map(c=>'<button class="chip '+(filter===c?"selected":"")+'" data-filter="'+c+'">'+c+'</button>').join("")+'</div><div style="height:12px"></div>'+cards(filtered)+'<p class="muted" style="font-size:11px;margin-top:22px">Preview listings are fictional examples, not confirmed events. Hosts can add their own listings.</p>'}
function detail(){const e=events.find(x=>x.id===selected);if(!e)return discover();return '<button class="textButton" data-back="1">← Back to events</button><div class="detailCover" style="background-image:url('+escapeHTML(e.image)+')"></div><span class="eyebrow">'+escapeHTML(e.category)+'</span><h1 class="pageTitle">'+escapeHTML(e.title)+'</h1><p class="muted">Hosted by '+escapeHTML(e.host)+'</p><div class="detailMeta"><span>◷ '+fmtDate(e.date)+' · '+escapeHTML(e.time)+'</span><span>⌖ '+escapeHTML(e.location)+'</span><span>'+money(e.price)+'</span></div><h2>About this event</h2><p class="detailText">'+escapeHTML(e.description)+'</p><div class="detailActions"><button class="primary" data-book="'+escapeHTML(e.id)+'">Get tickets · '+money(e.price)+'</button><button class="outline" data-save="'+escapeHTML(e.id)+'">'+(saved.includes(e.id)?"♥ Saved":"♡ Save event")+'</button></div><div class="notice">This is a prototype. Tickets are demo reservations stored on this device; no real payment or admission is issued.</div>'}
function savedPage(){return '<span class="eyebrow">Your collection</span><h1 class="pageTitle">Saved events.</h1><p class="muted">All the plans you want to keep close.</p>'+cards(events.filter(e=>saved.includes(e.id)))}
function ticketsPage(){return '<span class="eyebrow">Your plans</span><h1 class="pageTitle">My tickets.</h1><p class="muted">Your demo bookings, all in one place.</p>'+(bookings.length?bookings.map(b=>'<div class="ticketRow"><div><strong>'+escapeHTML(b.title)+'</strong><p class="muted" style="font-size:12px">'+escapeHTML(b.date)+' · '+b.quantity+' ticket(s)</p><small class="muted">Demo booking #'+escapeHTML(b.id)+'</small></div><strong>'+money(b.total)+'</strong></div>').join(""):'<div class="empty"><h3>No tickets yet</h3><p>Discover something worth going to.</p><button class="primary" data-page="discover">Explore events</button></div>')}
function hostPage(){const mine=read("events",[]);const total=bookings.filter(b=>mine.some(e=>e.id===b.eventId)).reduce((s,b)=>s+b.quantity,0);return '<span class="eyebrow">Creator studio</span><h1 class="pageTitle">Make it happen.</h1><p class="muted">Bring people together. Create an experience worth sharing.</p><div class="statGrid"><div class="stat"><strong>'+mine.length+'</strong><small>Events created</small></div><div class="stat"><strong>'+total+'</strong><small>Demo tickets booked</small></div><div class="stat"><strong>'+mine.filter(e=>new Date(e.date)>=new Date()).length+'</strong><small>Upcoming</small></div></div><div class="sectionHeading"><h2>Your events</h2><button class="primary" data-page="create">+ Create event</button></div>'+ (mine.length?cards(mine):'<div class="empty"><h3>Your first event starts here.</h3><p>Publish an event and it will appear in Discover on this device.</p><button class="primary" data-page="create">Create an event</button></div>')}
function createPage(){return '<button class="textButton" data-page="host">← Creator studio</button><h1 class="pageTitle">Create an event.</h1><p class="muted">Tell people what makes your event special.</p><div class="notice" style="margin:20px 0">Prototype mode: published events are stored only in this browser. Public hosting requires a database and authentication.</div><form class="form" id="createForm"><div class="field"><label>Event name</label><input name="title" maxlength="90" required placeholder="e.g. Dhaka Design Night"></div><div class="formGrid"><div class="field"><label>Category</label><select name="category"><option>Music</option><option>Art</option><option>Food</option><option>Nightlife</option><option>Community</option><option>Workshop</option><option>Film</option></select></div><div class="field"><label>Ticket price (BDT)</label><input name="price" type="number" min="0" max="1000000" value="0" required></div></div><div class="formGrid"><div class="field"><label>Date</label><input name="date" type="date" min="'+new Date().toISOString().slice(0,10)+'" required></div><div class="field"><label>Time</label><input name="time" type="time" required></div></div><div class="field"><label>Location</label><input name="location" maxlength="120" required placeholder="Venue, Dhaka"></div><div class="field"><label>Host name</label><input name="host" maxlength="80" required placeholder="Your name or organization"></div><div class="field"><label>Description</label><textarea name="description" maxlength="1500" required placeholder="What can people expect?"></textarea></div><button class="primary" type="submit">Publish demo event ↗</button></form>'}
function communityPage(){return '<span class="eyebrow">FOMO social</span><h1 class="pageTitle">The conversation.</h1><p class="muted">Share what you are excited about.</p><form id="postForm" class="form" style="margin:25px 0"><div class="field"><textarea name="message" maxlength="300" placeholder="What are your weekend plans?" required></textarea></div><button class="primary" type="submit">Post update ↗</button></form><div class="feedPost"><strong>FOMO team</strong><small>Welcome</small><p>Dhaka is full of stories. Find yours here. ✦</p></div>'+posts.map(p=>'<div class="feedPost"><strong>Guest</strong><small>'+escapeHTML(p.date)+'</small><p>'+escapeHTML(p.message)+'</p></div>').join("")+'<div class="notice">Social posts are local demo content. Accounts, moderation, and public feeds are not yet connected.</div>'}
function bookingModal(){const e=events.find(x=>x.id===selected);if(!e)return "";return '<div class="modalOverlay" id="overlay"><div class="modal" role="dialog" aria-modal="true" aria-label="Demo ticket reservation"><div class="topline"><span class="eyebrow">Reserve your spot</span><button class="textButton" data-close="1">✕ Close</button></div><h2>'+escapeHTML(e.title)+'</h2><p class="muted">'+fmtDate(e.date)+' · '+escapeHTML(e.location)+'</p><div class="ticketRow"><div><strong>General admission</strong><p class="muted">'+money(e.price)+' / ticket</p></div><div class="counter"><button data-qty="-1" aria-label="Decrease quantity">−</button><strong>'+quantity+'</strong><button data-qty="1" aria-label="Increase quantity">+</button></div></div><div class="topline"><strong>Total</strong><strong>'+money(e.price*quantity)+'</strong></div><button class="primary" data-confirm="1">Confirm demo reservation</button><p class="muted" style="font-size:11px;text-align:center">No payment will be taken. This does not issue a valid ticket.</p></div></div>'}
function render(){const side='<aside class="sidebar"><div class="logo">fomo<span></span></div><p class="tagline">GO WHERE LIFE HAPPENS.</p><nav class="nav">'+navItem("discover","⌂","Discover")+navItem("community","◎","Community")+navItem("saved","♡","Saved")+navItem("tickets","▤","My tickets")+navItem("host","◈","Host studio")+'</nav><button class="primary hostBtn" data-page="create">+ Create an event</button><div class="sidebarBottom">FOMO © 2026 · Made for Dhaka</div></aside>';const right='<aside class="right"><input class="search" id="sideSearch" placeholder="⌕  Search events" value="'+escapeHTML(query)+'"><h3>Coming up</h3>'+events.slice(0,3).map(e=>'<div class="mini" data-event="'+escapeHTML(e.id)+'"><img src="'+escapeHTML(e.image)+'" alt=""><div><strong>'+escapeHTML(e.title)+'</strong><small>'+fmtDate(e.date)+' · '+escapeHTML(e.location)+'</small></div></div>').join("")+'<div class="promo"><span class="eyebrow">For creators</span><h3>Bring your people together.</h3><p>Have something amazing planned? Give it a home on FOMO.</p><button class="outline" data-page="create">Host an event ↗</button></div></aside>';const mobile='<div class="mobileTop"><div class="logo">fomo<span></span></div><span class="city">⌖ Dhaka</span></div>';const mobileNav='<nav class="mobileNav">'+[["discover","⌂","Explore"],["community","◎","Social"],["saved","♡","Saved"],["tickets","▤","Tickets"],["host","◈","Host"]].map(([p,i,l])=>'<button class="'+(page===p?"active":"")+'" data-page="'+p+'"><b>'+i+'</b>'+l+'</button>').join("")+'</nav>';let body=selected?detail():page==="discover"?discover():page==="saved"?savedPage():page==="tickets"?ticketsPage():page==="host"?hostPage():page==="create"?createPage():communityPage();$("#app").innerHTML='<div class="app">'+side+'<main class="main">'+mobile+body+'</main>'+right+'</div>'+mobileNav+(modal?bookingModal():"")}
document.addEventListener("click",e=>{const target=e.target.closest("[data-page],[data-event],[data-save],[data-filter],[data-book],[data-back],[data-close],[data-qty],[data-confirm],[data-explore]");if(!target)return;const d=target.dataset;if(d.save){e.stopPropagation();saved=saved.includes(d.save)?saved.filter(id=>id!==d.save):[...saved,d.save];store("saved",saved);render();return}if(d.page){go(d.page);return}if(d.event){selected=d.event;page="discover";window.scrollTo(0,0);render();return}if(d.filter){filter=d.filter;render();return}if(d.back){selected=null;render();return}if(d.book){selected=d.book;quantity=1;modal=true;render();return}if(d.close){modal=false;render();return}if(d.qty){quantity=Math.min(10,Math.max(1,quantity+Number(d.qty)));render();return}if(d.confirm){const ev=events.find(x=>x.id===selected);if(!ev)return;bookings.unshift({id:Math.random().toString(36).slice(2,10).toUpperCase(),eventId:ev.id,title:ev.title,date:ev.date,quantity,total:ev.price*quantity});store("bookings",bookings);go("tickets");notify("Demo reservation saved!");return}if(d.explore){document.getElementById("explore")?.scrollIntoView({behavior:"smooth"});return}});
document.addEventListener("input",e=>{if(e.target.id==="sideSearch"){const pos=e.target.selectionStart;query=e.target.value;page="discover";selected=null;render();const s=$("#sideSearch");s.focus();s.setSelectionRange(pos,pos)}});
document.addEventListener("submit",e=>{if(e.target.id==="createForm"){e.preventDefault();const f=new FormData(e.target);const cat=String(f.get("category"));const ev={id:"custom_"+Date.now(),title:String(f.get("title")).trim(),category:cat,date:String(f.get("date")),time:String(f.get("time")),location:String(f.get("location")).trim(),price:Number(f.get("price")),image:images[cat.toLowerCase()]||images.community,host:String(f.get("host")).trim(),description:String(f.get("description")).trim()};if(!ev.title||!ev.location||!ev.host||!ev.description||!ev.date||!ev.time||ev.price<0||!Number.isFinite(ev.price)){notify("Please complete all fields.");return}const custom=read("events",[]);custom.unshift(ev);store("events",custom);events=[...starter,...custom];go("host");notify("Demo event published locally!")}if(e.target.id==="postForm"){e.preventDefault();const message=new FormData(e.target).get("message").toString().trim();if(!message)return;posts.unshift({message,date:new Date().toLocaleDateString()});store("posts",posts);render();notify("Posted to your local demo feed!")}});render();
</script></body></html>
